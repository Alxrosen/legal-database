# Canonical practice-area taxonomy.
#
# Schema:
#   - slug: stable kebab-case identifier (FK target). NEVER change once shipped.
#     name: human-readable label.
#     priority: optional bool. Defaults to false. Marks categories the
#               business cares about specifically (today: anything under
#               Personal Injury).
#     parent: optional slug. Subcategories roll up to their parent at
#             query time — a firm tagged with a child is implicitly tagged
#             with the parent.
#     aliases: list of strings the system should treat as equivalent.
#              Both these aliases AND the scraped value are normalized
#              the same way (lowercase, trim, collapse whitespace, strip
#              filler words ["law","attorney","attorneys","lawyer",
#              "lawyers","legal","services","practice"], strip
#              punctuation, singularize) and matched by EXACT equality.
#              Add new aliases by inspecting unmatched_practice_areas.
#     description: optional, for humans.
#
# Loading: a seed script (added in M3) upserts this file into the
# `practice_areas` and `practice_area_aliases` tables. The YAML is the
# source of truth; the DB is a read-optimized projection.

areas:

  # ---------- Personal Injury (PRIORITY) ----------
  - slug: personal-injury
    name: Personal Injury
    priority: true
    description: >
      Catch-all for plaintiff-side bodily-injury work. Firms tagged with
      any of the child slugs below are implicitly tagged with this slug.
    aliases:
      - personal injury
      - personal injury law
      - pi
      - injury
      - injury law
      - injuries
      - bodily injury
      - accident
      - accidents
      - accident law
      - plaintiff personal injury
      - plaintiffs personal injury
      - tort
      - torts
      - tort law
      - civil litigation injury
      - catastrophic injury

