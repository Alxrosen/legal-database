# Alembic configuration.
#
# The DB URL is intentionally left blank here; migrations/env.py loads it
# from legal_sourcing.config.get_settings() so .env stays the single
# source of truth.

[alembic]
script_location = migrations
prepend_sys_path = src
version_path_separator = os
timezone = UTC

# sqlalchemy.url is set programmatically in env.py.
sqlalchemy.url =

[post_write_hooks]
# Auto-format generated migrations with ruff.
hooks = ruff_format, ruff_fix
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = console_scripts
ruff_fix.entrypoint = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
