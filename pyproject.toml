[project]
name = "legal-sourcing"
version = "0.1.0"
description = "Scrape, normalize, and resolve US law firm data into a canonical database."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Alexander Rosen" }]

dependencies = [
    # HTTP + parsing
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "beautifulsoup4>=4.12",

    # Data normalization
    "rapidfuzz>=3.9",
    "usaddress>=0.5.10",
    "phonenumbers>=8.13",

    # Persistence
    "sqlalchemy>=2.0",
    "alembic>=1.13",

    # Reference data / text processing
    "pyyaml>=6.0",
    "inflect>=7.3",  # singularize "injuries" -> "injury" for practice-area matching

    # IANA tzdata for zoneinfo lookups on Windows (Python stdlib zoneinfo
    # has no fallback database on Windows). Used by alembic.ini's
    # `timezone = UTC` and any ZoneInfo() callsites.
    "tzdata>=2024.1",

    # Config + logging
    "pydantic-settings>=2.4",
    "structlog>=24.4",

    # CLI
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "respx>=0.21",  # httpx mocking for scraper tests
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_sourcing"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",           # ruff-specific
]
ignore = ["E501"]    # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
