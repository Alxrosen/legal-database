# Proposed CI for legal-deal-sourcing  —  lands at: .github/workflows/ci.yml
# Mirrors `make check` + `make test`. The suite runs in ~4.5s, so this is near-instant.
# Action versions: pin to the current major (verify on the GitHub Marketplace at apply time).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # uv resolves a Python per `requires-python` (>=3.11). To pin the dev
      # runtime (3.14), commit a `.python-version` file or add:
      #   - run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Format check
        run: uv run ruff format --check src tests
      - name: Tests
        run: uv run pytest
